site_name: 王维诗里的MBTI
site_url: https://dannyparticle.github.io/
site_description: 王维诗里的MBTI 频道维基 —— 角色档案、设定资料与荣格八维理论
site_author: DannyParticle
copyright: >-
  维基内容整理自「王维诗里的MBTI Wiki」（原 Fandom），依 CC BY-SA 3.0 许可发布

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang: zh          # 中文分词由 jieba 在构建期完成
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
      # 让中文标题生成可用的锚点（默认 slugify 会把中文全部丢掉）
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 博客: blog/index.md
  - 维基:
      - 维基首页: wiki/index.md
      - 关于本维基: wiki/about.md
      - 频道介绍: wiki/channel.md
      - 角色档案:
          - 胡紫（INTJ）: wiki/characters/huzi-intj.md
          - 舒迢（INTP）: wiki/characters/shutiao-intp.md
          - 吕强人（ENTJ）: wiki/characters/lvqiangren-entj.md
          - 郭哲梅（ENTP）: wiki/characters/guozhemei-entp.md
          - 百里透黑（INFJ）: wiki/characters/bailitouhei-infj.md
          - 萧福叠（INFP）: wiki/characters/xiaofudie-infp.md
          - 苏达简（ENFJ）: wiki/characters/sudajian-enfj.md
          - 修勾勾（ENFP）: wiki/characters/xiugougou-enfp.md
          - 郝瑟（ISTJ）: wiki/characters/haose-istj.md
          - 马麻（ISFJ）: wiki/characters/mama-isfj.md
          - 池梓（ESTJ）: wiki/characters/chizi-estj.md
          - 单歌（ESFJ）: wiki/characters/shange-esfj.md
          - 祖安（ISTP）: wiki/characters/zuan-istp.md
          - 柳怜（ISFP）: wiki/characters/liulian-isfp.md
          - 莫竞（ESTP）: wiki/characters/mojing-estp.md
          - 崔崔（ESFP）: wiki/characters/cuicui-esfp.md
      - 设定与作品:
          - 《不器》: wiki/works/buqi.md
          - 工作室: wiki/studio.md
          - 各 MBTI 排列组合: wiki/pairings.md
          - B站二创精选: wiki/works/bilibili-fanworks.md
      - 理论:
          - 荣格理论和荣格八维: wiki/theory/jung-eight-functions.md
      - 相关人物:
          - 王元元: wiki/people/wangyuanyuan.md
          - 维基: wiki/people/viki.md
          - 云中鹿饮溪: wiki/people/yunzhongluyinxi.md
          - 狐狸刷刷: wiki/people/hulishuashua.md
          - 骨哥说: wiki/people/guge.md
  - 标签: tags.md
